name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: Extension (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Upload built extension
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: extension/dist
          retention-days: 14

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest available on GitHub runners (local dev is 3.9, which runners no longer offer) and the hosting runtime.
        python: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: App imports and compiles
        run: |
          python -m compileall -q app evals
          python -c "import app.main; print('routes:', sorted(r.path for r in app.main.app.routes))"
      - name: Trust signals eval (code only, no OpenAI calls)
        run: python -m evals.trust_eval --no-llm
